# Weekly, grouped, and never a release younger than a week. Every update goes through CI like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # The image's base, pinned by digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The development tools in uv.lock: the harness itself uses the standard library only.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
