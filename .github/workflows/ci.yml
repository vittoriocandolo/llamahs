name: CI

on:
  push:
  pull_request:

permissions:
  contents: read # to check out the repository

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked typos
      - run: git ls-files -z '*.md' | xargs -0 uv run --locked mdformat --check
      - run: uv run --locked zizmor --persona auditor .
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked mypy
      - run: uv run --locked coverage run -m pytest
      - run: uv run --locked coverage report

  image:
    name: build the image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag llamahs:ci .
      - run: docker run --rm --network none --read-only llamahs:ci bash -lc 'timeout --version && python3 --version && rg --version && jq --version && git --version'
